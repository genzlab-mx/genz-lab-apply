<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9BFE0">
<meta name="robots" content="noindex">
<title>지원서 · Gen Z Lab.</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="apply-page">
<div class="bg rotate" aria-hidden="true"></div>

<main class="apply">
  <div class="topline">
    <div class="brand">
      <img src="assets/logo-navy.png" alt="Gen Z Lab.">
      <span class="bar"></span>
      <span class="name">지원서</span>
    </div>
    <!-- 들어온 사람: 이름 · Knox ID -->
    <button type="button" class="user" id="user" hidden aria-label="다른 Knox ID로 다시 시작">
      <b id="user-name"></b><span id="user-knox"></span>
    </button>
  </div>

  <div class="banner" id="demo-banner" hidden>미리보기 모드예요. 이 브라우저에만 저장되고 실제로 제출되지 않아요. (데모 PIN: 1234)</div>

  <!-- 불러오는 중 / 오류 -->
  <section id="view-loading" class="view">
    <h1 id="loading-text">불러오는 중…</h1>
  </section>

  <!-- 1단계: Knox ID · 이름 -->
  <section id="view-login" class="view narrow" hidden>
    <h1 class="form-title"></h1>
    <form class="glass card with-mascot" id="login-form" autocomplete="off" novalidate>
      <img class="mascot" src="assets/glimming.png" alt="">
      <div class="field-row">
        <label class="lbl" for="login-knox">Knox ID</label>
        <input class="field" id="login-knox" type="text" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="60" placeholder="예: gildong.hong" required>
      </div>
      <div class="field-row">
        <label class="lbl" for="login-name">이름</label>
        <input class="field" id="login-name" type="text" maxlength="30" placeholder="예: 홍길동" required>
      </div>
      <p class="err" id="login-err" role="alert" hidden></p>
      <button type="submit" class="btn-coral" id="login-btn">다음</button>
    </form>
    <p class="hint center">Knox ID 하나로 지원서 한 장을 쓸 수 있어요.</p>
  </section>

  <!-- 2단계: PIN 정하기 / PIN 입력 -->
  <section id="view-pin" class="view narrow" hidden>
    <h1 id="pin-heading"></h1>
    <form class="glass card with-mascot" id="pin-form" autocomplete="off" novalidate>
      <img class="mascot" src="assets/glimming.png" alt="">
      <p class="desc" id="pin-desc"></p>
      <div class="field-row">
        <label class="lbl" for="pin1" id="pin1-label">PIN 4자리</label>
        <input class="field pin-field" id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required>
      </div>
      <div class="field-row" id="pin2-row">
        <label class="lbl" for="pin2">PIN 확인</label>
        <input class="field pin-field" id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
      </div>
      <p class="err" id="pin-err" role="alert" hidden></p>
      <button type="submit" class="btn-coral" id="pin-btn"></button>
    </form>
    <p class="hint center" id="pin-help"></p>
    <button type="button" class="linklike" id="pin-back">Knox ID 다시 입력</button>
  </section>

  <!-- 3단계: 지원서 작성 -->
  <section id="view-form" class="view" hidden>
    <div class="glass card intro-card">
      <h1 class="form-title"></h1>
      <p class="intro" id="form-intro"></p>
      <p class="meta"><span class="req">*</span> 표시는 꼭 답해야 하는 질문이에요.</p>
    </div>
    <div class="banner" id="closed-banner" hidden>모집이 마감되어 더 이상 저장하거나 제출할 수 없어요.</div>
    <div id="questions" class="questions"></div>
  </section>

  <!-- 제출 완료 (방금 제출) -->
  <section id="view-done" class="view narrow" hidden>
    <div class="glass card result">
      <img src="assets/glimming.png" alt="">
      <span class="badge">제출 완료</span>
      <div class="title">지원서를 제출했어요</div>
      <p class="desc" id="done-desc"></p>
    </div>
  </section>

  <!-- 이미 응답한 Knox ID -->
  <section id="view-already" class="view narrow" hidden>
    <div class="glass card result">
      <img src="assets/glimming.png" alt="">
      <span class="badge" id="already-knox"></span>
      <div class="title">이미 응답하셨습니다</div>
      <p class="desc">이 Knox ID로 제출된 지원서가 있어요.<br>내용을 고쳐야 한다면 담당자에게 문의해 주세요.</p>
    </div>
    <button type="button" class="linklike" data-restart>다른 Knox ID로 시작</button>
  </section>

  <!-- 모집 마감 (처음 오는 사람) -->
  <section id="view-closed" class="view narrow" hidden>
    <div class="glass card result">
      <img src="assets/glimming.png" alt="">
      <span class="badge">모집 마감</span>
      <div class="title">모집이 마감되었어요</div>
      <p class="desc">관심 가져 주셔서 고마워요.</p>
    </div>
    <button type="button" class="linklike" data-restart>다른 Knox ID로 시작</button>
  </section>
</main>

<!-- 작성 화면 아래 고정 버튼 -->
<div class="action-bar" id="action-bar" hidden>
  <div class="inner">
    <div class="status" id="save-status" role="status" aria-live="polite"></div>
    <div class="btns">
      <button type="button" class="btn-ghost-lg" id="save-btn">임시 저장</button>
      <button type="button" class="btn-coral" id="submit-btn">제출하기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/demo.js"></script>
<script src="js/apply.js"></script>
</body>
</html>
